[project]
name = "minicommerce"
version = "10.0.0"
description = "Enterprise Security, Distributed Resilience & CI/CD DevOps Laboratory"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/app", "backend/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "I",   # isort import sorting
    "S",   # flake8-bandit security
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "S101",  # Use of assert (necessary for pytest)
    "S104",  # Possible binding to all interfaces (0.0.0.0 is required for Docker containers)
    "B008",  # Do not perform function call in argument defaults (FastAPI Depends)
    "E501",  # Line too long (handled by ruff formatter)
    "S105",  # Hardcoded password string (test defaults/fixtures)
    "S106",  # Hardcoded password function argument
    "E712",  # Avoid equality comparisons to True/False (SQLAlchemy ORM column boolean queries)
    "F841",  # Local variable assigned but unused
    "B023",  # Function definition does not bind loop variable
    "S110",  # Try-except-pass block
    "B904",  # Exception chaining raise ... from err
    "N818",  # Exception name should be named with Error suffix
    "UP042", # Class inherits from str and Enum
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S105", "S106", "F841"]
"backend/app/core/config.py" = ["S105"]
"backend/app/db/*" = ["S105", "S110", "B023", "E402", "S311", "S608"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "backend"
disable_error_code = ["misc"]
exclude = [
    "app/db/.*",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "backend/tests/*",
    "backend/app/db/run_benchmarks.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 75
