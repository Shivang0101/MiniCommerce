<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniCommerce V1 - Backend Engineering Laboratory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Navigation Bar -->
    <header class="navbar">
      <div class="nav-container">
        <div class="brand">
          <div class="brand-logo">⚡</div>
          <div class="brand-text">
            <span class="brand-name">MiniCommerce</span>
            <span class="brand-tag">V1 LAB</span>
          </div>
        </div>

        <div class="nav-actions">
          <div id="user-profile" class="user-profile hidden">
            <span class="user-icon">👤</span>
            <span id="user-email" class="user-email"></span>
            <button id="orders-btn" class="btn btn-secondary btn-sm">📦 Orders</button>
            <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
          </div>

          <div id="auth-buttons">
            <button id="open-login-btn" class="btn btn-primary btn-sm">Login / Register</button>
          </div>

          <button id="cart-toggle-btn" class="btn btn-cart">
            🛒 <span class="cart-label">Cart</span>
            <span id="cart-badge" class="cart-badge">0</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Subheader / Banner -->
    <section class="hero-banner">
      <div class="banner-content">
        <h1>Backend Architecture Laboratory</h1>
        <p>Testing FastAPI • PostgreSQL • SQLAlchemy 2.x • JWT • Atomic Transactions</p>
      </div>
      <div id="lab-quick-login" class="lab-quick-login">
        <span class="quick-title">Quick Test Login:</span>
        <button class="quick-user-btn" data-email="alice@example.com">Alice</button>
        <button class="quick-user-btn" data-email="bob@example.com">Bob</button>
        <button class="quick-user-btn" data-email="charlie@example.com">Charlie</button>
      </div>
    </section>

    <!-- Main Content Container -->
    <main class="main-container">
      <!-- Section Title & Filter Controls -->
      <div class="section-header">
        <div>
          <h2>Product Catalog <span class="v2-tag">V2</span></h2>
          <span id="product-count" class="badge badge-info">Loading products...</span>
        </div>

        <div class="catalog-controls">
          <div class="control-group">
            <label for="sort-by-select">Sort:</label>
            <select id="sort-by-select" class="form-select">
              <option value="name">Name</option>
              <option value="price">Price</option>
              <option value="stock">Stock</option>
              <option value="created_at">Newest</option>
            </select>
            <select id="sort-order-select" class="form-select">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>

          <div class="control-group">
            <label>Price:</label>
            <input type="number" id="min-price-input" placeholder="Min $" min="0" class="form-input-sm">
            <span>-</span>
            <input type="number" id="max-price-input" placeholder="Max $" min="0" class="form-input-sm">
            <button id="apply-filter-btn" class="btn btn-secondary btn-sm">Filter</button>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div id="products-grid" class="products-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Pagination Container -->
      <div class="pagination-container">
        <button id="prev-page-btn" class="btn btn-outline btn-sm" disabled>&laquo; Previous</button>
        <span id="page-indicator" class="page-indicator">Page 1</span>
        <button id="next-page-btn" class="btn btn-outline btn-sm">Next &raquo;</button>
      </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-overlay" class="overlay hidden"></div>
    <aside id="cart-drawer" class="cart-drawer hidden">
      <div class="drawer-header">
        <h3>Shopping Cart</h3>
        <button id="close-cart-btn" class="btn-close">&times;</button>
      </div>

      <div id="cart-items-container" class="cart-items-container">
        <!-- Cart items rendered dynamically -->
      </div>

      <div class="cart-footer">
        <div class="cart-summary">
          <div class="summary-row total">
            <span>Total:</span>
            <span id="cart-total-price">$0.00</span>
          </div>
        </div>
        <button id="checkout-btn" class="btn btn-success btn-block" disabled>
          ⚡ Atomic Checkout
        </button>
      </div>
    </aside>

    <!-- Orders Modal -->
    <div id="orders-modal" class="modal-overlay hidden">
      <div class="modal-card modal-lg">
        <div class="modal-header">
          <h3>Your Order History</h3>
          <button id="close-orders-btn" class="btn-close">&times;</button>
        </div>
        <div id="orders-list-container" class="orders-list-container">
          <!-- Orders rendered dynamically -->
        </div>
      </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active">Login</button>
            <button id="tab-register" class="tab-btn">Register</button>
          </div>
          <button id="close-auth-btn" class="btn-close">&times;</button>
        </div>

        <form id="auth-form" class="auth-form">
          <div class="form-group">
            <label for="auth-email">Email Address</label>
            <input type="email" id="auth-email" required placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••">
          </div>

          <div id="auth-error" class="form-error hidden"></div>

          <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-block">Login</button>
        </form>
      </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
